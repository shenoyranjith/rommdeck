<?xml version="1.0" encoding="UTF-8"?>
<!-- RommDeck mark  chamfered frame, grid, neon RD (default candy accent). -->
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 100 100" role="img" aria-label="RommDeck">
  <defs>
    <pattern id="grid" width="9" height="9" patternUnits="userSpaceOnUse">
      <path d="M 9 0 L 0 0 0 9" fill="none" stroke="#ff2d95" stroke-opacity="0.16" stroke-width="0.65"/>
    </pattern>
    <radialGradient id="glow" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#ff2d95" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#ff2d95" stop-opacity="0"/>
    </radialGradient>
    <filter id="neon" x="-35%" y="-35%" width="170%" height="170%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="1.1" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <polygon points="16,3 84,3 97,16 97,84 84,97 16,97 3,84 3,16" fill="#050508"/>
  <polygon points="16,3 84,3 97,16 97,84 84,97 16,97 3,84 3,16" fill="url(#grid)"/>
  <polygon points="16,3 84,3 97,16 97,84 84,97 16,97 3,84 3,16" fill="url(#glow)"/>
  <polygon points="16,3 84,3 97,16 97,84 84,97 16,97 3,84 3,16" fill="none" stroke="#ff2d95" stroke-width="2.75" stroke-linejoin="miter" filter="url(#neon)"/>
  <text x="50" y="53" text-anchor="middle" dominant-baseline="middle" fill="#ff2d95" font-size="48" font-weight="750" font-family="IBM Plex Sans, system-ui, sans-serif" letter-spacing="2.5" filter="url(#neon)">RD</text>
</svg>
