# JVM heap for Gradle itself (not your app)
org.gradle.jvmargs=-Xmx2048M -Dfile.encoding=UTF-8

# AndroidX libraries (required for modern Android projects)
android.useAndroidX=true

includeAndroid=false

# Kotlin/Compose compiler alignment
kotlin.code.style=official

# Compose Hot Reload needs JetBrains Runtime at run time (enhanced class redefinition).
compose.reload.jbr.autoProvisioningEnabled=true

# App version (keep in sync with release tags)
rommdeck.version=0.1.0
